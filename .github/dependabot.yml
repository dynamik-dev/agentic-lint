version: 2

# 48h cooldown on every ecosystem: any newly-published version must sit on the
# registry for at least 2 days before Dependabot will propose it. This is the
# blast-radius mitigation for fresh supply-chain compromises (stolen tokens,
# typosquats, malicious releases) — most are detected and yanked within hours,
# so 48h is enough to avoid the worst window without slowing the project to a
# crawl. Applies to patch/minor/major identically.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 2
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 2
    groups:
      dev:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 2

  # No npm ecosystem: there is no package.json at the repo root, and Dependabot
  # hard-errors ("dependency_file_not_found") rather than no-op'ing on a missing
  # manifest. Add an `npm` stanza here only once a root package.json actually lands.
